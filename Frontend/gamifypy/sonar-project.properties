# Configuración de SonarQube para el Frontend (React/Vite)

sonar.projectKey=gamifypy-owasp-frontend
sonar.projectName=GamifyPy OWASP - Frontend
sonar.projectVersion=2.0

# Directorios del proyecto frontend
sonar.sources=src
sonar.tests=src/test

# Codificación
sonar.sourceEncoding=UTF-8

# Exclusiones
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  build/**,\
  coverage/**,\
  **/*.config.js,\
  vite.config.js,\
  eslint.config.js,\
  src/test/**

# Exclusiones de cobertura
sonar.coverage.exclusions=\
  src/test/**,\
  **/*.config.js,\
  **/*.test.js,\
  **/*.test.jsx

# Reporte de cobertura de código
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/test/**,**/*.test.js,**/*.test.jsx

# Test execution reports
sonar.testExecutionReportPaths=coverage/test-report.xml

# Configuración del servidor
sonar.host.url=http://localhost:9000

# Token (agregar después de generar en SonarQube)
# sonar.token=YOUR_TOKEN_HERE
