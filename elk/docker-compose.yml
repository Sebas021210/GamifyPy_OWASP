version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
    networks:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
      - xpack.encryptedSavedObjects.encryptionKey=a7a6311933d3503b89bc2dbc36572c33a6c10925682e591bffcab6911c06786d
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elk

  filebeat:
    build:
      context: ./filebeat
    image: custom-filebeat:8.13.0
    user: root
    volumes:
      - ../backend/logs:/usr/share/logs
    depends_on:
      - elasticsearch
    networks:
      - elk

  heartbeat:
    build:
      context: ./heartbeat
    image: custom-heartbeat:8.13.0
    user: root
    depends_on:
      - elasticsearch
    networks:
      - elk

networks:
  elk:
    driver: bridge
