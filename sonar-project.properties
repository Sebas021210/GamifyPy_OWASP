# Configuración del Proyecto SonarQube para GamifyPy_OWASP
# ================================================================

# Información del Proyecto
sonar.projectKey=gamifypy-owasp
sonar.projectName=GamifyPy OWASP
sonar.projectVersion=1.0

# Directorio fuente del proyecto
sonar.sources=backend,Frontend/gamifypy/src

# Directorios de pruebas (comentado para evitar conflictos)
# sonar.tests=backend/test,Frontend/gamifypy/test

# Codificación del código fuente
sonar.sourceEncoding=UTF-8

# Exclusiones globales
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/env/**,\
  **/.venv/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/test/**,\
  **/*.min.js,\
  **/*.config.js,\
  **/vite.config.js,\
  **/eslint.config.js

# Exclusiones de cobertura
sonar.coverage.exclusions=\
  **/test/**,\
  **/__pycache__/**,\
  **/node_modules/**

# Configuración para Python (Backend)
sonar.python.version=3.8,3.9,3.10,3.11,3.12

# Configuración para JavaScript/TypeScript (Frontend)
sonar.javascript.node.maxspace=4096

# URLs del servidor SonarQube
sonar.host.url=http://localhost:9000

# Token de autenticación (debe ser generado en SonarQube)
# Reemplazar con tu token real después de crear el proyecto en SonarQube
# sonar.token=YOUR_SONARQUBE_TOKEN_HERE

# Configuración adicional de lenguajes
sonar.language=py,js,jsx

# Reportes de cobertura (opcional - si tienes reportes de coverage)
# sonar.python.coverage.reportPaths=coverage.xml
# sonar.javascript.lcov.reportPaths=Frontend/gamifypy/coverage/lcov.info

# Configuración de análisis
sonar.scm.disabled=false
sonar.scm.provider=git

# Configuración de duplicación de código
sonar.cpd.exclusions=**/*.jsx,**/*.css
